# Corpus exclusions (spec 14, ADR 0008). Reviewed noise that stays out of the searchable corpus.
# Per source id: ordered rules, the last matching rule wins, a file with no matching rule stays.
# Paths are inside the snapshot (no source id). `*` matches any characters including "/".
# Basis: reports/noise-audit.md (2026-10-30). Approved by the owner on 2026-10-30 (three groups):
#   A. Python library/ curated to the modules a learner and an AI engineer use
#   B. migration, deprecation and breaking-change pages
#   C. link-list pages (navigation with almost no explanation)
#   D. release-note changelogs, sample test-data files, a site-theme template, one exact duplicate page (added 2026-10-30)
# YAML allows one entry per source id, so the groups are marked in the reasons.

python-docs:
  - exclude: "Doc/library/*"
    reason: "A: most standard library pages are not taught in the course (tkinter, curses, audio, removed and legacy modules); only the list below is kept."
  # Kept (30). Functions, stdtypes and exceptions live in Doc/builtins and are not affected.
  - include: "Doc/library/sys.rst"
  - include: "Doc/library/os.rst"
  - include: "Doc/library/pathlib.rst"
  - include: "Doc/library/json.rst"
  - include: "Doc/library/math.rst"
