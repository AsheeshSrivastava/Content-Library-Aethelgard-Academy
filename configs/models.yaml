      scope: configuration_bert.py (168 lines) and modeling_bert.py (2357 lines), searched for process, network, file, eval and pickle calls and read the import list
      result: No subprocess, socket, requests, urllib, eval, exec, pickle or os.system. `os` is used only to resolve a TensorFlow checkpoint path; `tensorflow` is imported inside the TF checkpoint loader (line 105) and not at import time. `AutoTokenizer.from_pretrained(config._name_or_path)` (lines 1110 and 1171) fetches tokenizer files from the Hub when the model is built, so a fully offline load needs those files cached; the smoke test checks this.
