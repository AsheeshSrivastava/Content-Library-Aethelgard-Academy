[project]
name = "ragcore"
version = "0.0.1"
description = "Aethelgard RAG library: sources, loaders, passages, search"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: needs the internet; run on purpose with -m network"]
addopts = "-m 'not network'"

[dependency-groups]
dev = ["pytest>=9.1.1"]
